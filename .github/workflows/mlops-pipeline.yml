name: MLOps Multi-Branch Automatizado

on:
  push:
    branches: [ dev, prod ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Autenticar en GCP (OIDC Seguro v3)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Etapa Test - Obtener Assets del Bucket (Requerimiento)
      env:
        GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
      run: python src/download_assets.py

    - name: Etapa Test - Ejecutar Pruebas Unitarias
      run: pytest tests/ -v

  build-promote:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Autenticar en GCP (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        token_format: 'access_token'

    - name: Configurar herramientas GCP
      uses: google-github-actions/setup-gcloud@v2

    - name: Autenticar Docker en Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Crear repositorio Docker si no existe
      run: |
        gcloud artifacts repositories describe repo-taller --location=us-central1 || \
        gcloud artifacts repositories create repo-taller \
          --repository-format=docker \
          --location=us-central1 \
          --description="Contenedores MLOps"

    - name: Construir Imagen Docker (Usa el nombre de la rama actual como etiqueta)
      run: |
        docker build \
          --build-arg ENV=${{ github.ref_name }} \
          --build-arg GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }} \
          -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/repo-taller/api-modelo:${{ github.ref_name }} .

    - name: Subir Contenedor al Registro
      run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/repo-taller/api-modelo:${{ github.ref_name }}

    - name: Desplegar Endpoint Asociado a la Rama Actual (dev o prod)
      run: |
        gcloud run deploy servicio-modelo-${{ github.ref_name }} \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/repo-taller/api-modelo:${{ github.ref_name }} \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "ENV=${{ github.ref_name }},GCP_BUCKET_NAME=${{ secrets.GCP_BUCKET_NAME }}"